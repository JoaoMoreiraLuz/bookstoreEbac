services:
  web:
    build: .
    command: python manage.py runserver 0.0.0:8000
    volumes:
      - .:/usr/src/app/
    ports:
      - "8000:8000"
    env_file:
      - ./env.dev
    environment:
    - db

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
    - POSTGRES_DB=bookstore_db
    - POSTGRES_USER=user
    - POSTGRES_PASSWORD=dev

volumes:
  postgres_data: